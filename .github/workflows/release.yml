name: Build and Release Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Unique Release Variables
        id: vars
        run: |
          # Uses github.run_number to ensure the release tag is unique every run
          echo "TAG_NAME=v1.0.0-build.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=Elementa v1.0.0 (Build ${{ github.run_number }})" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Web / Android Assets
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: ${{ steps.vars.outputs.RELEASE_TITLE }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
