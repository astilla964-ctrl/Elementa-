name: Build and Release Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Automatic Build Version
        id: versioning
        run: |
          BUILD_NUM="${{ github.run_number }}"
          echo "TAG_NAME=v1.0.0-build.${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=Elementa v1.0.0 (Build ${BUILD_NUM})" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Create Automatic Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.TAG_NAME }}
          name: ${{ steps.versioning.outputs.RELEASE_TITLE }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
