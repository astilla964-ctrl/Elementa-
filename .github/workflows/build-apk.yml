name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Failed to detect Java version."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer, found $JAVA_VER."
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Debug keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected APK '$TARGET_APK' does not exist."
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: '$TARGET_APK' exists but is empty (0 bytes)."
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "Error: '$TARGET_APK' does not have a .apk extension."; exit 1 ;;
          esac

          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          echo "Verified APK: $TARGET_APK ($(stat -c%s "$TARGET_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        run: |
          RELEASE_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$RELEASE_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_DIR/app-debug.apk"
          if [ ! -f "$RELEASE_DIR/app-debug.apk" ]; then
            echo "Error: Failed to copy APK to temporary release asset directory."
            exit 1
          fi
          echo "Prepared APK release asset at $RELEASE_DIR/app-debug.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: Elementa v1.0.0 (Build ${{ github.run_number }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ runner.temp }}/release-asset/app-debug.apk
